# One-click local stack: Ollama (LLM) + DB Agent (talks to cloud Databricks).
#
#   cp app/.env.example app/.env   # set DATABRICKS_* (token never commit)
#   docker compose up --build
#   open http://localhost:3001
#
# Warehouse stays in Databricks cloud — it is not containerized.
# On Mac (Metal GPU), prefer host Ollama:
#   docker compose --profile host-ollama up --build

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull $${OLLAMA_CHAT_MODEL:-qwen2.5-coder:0.5b}
        ollama pull $${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5-coder:0.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    restart: "no"

  db-agent:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./app/.env
    environment:
      PORT: "3001"
      SQL_ENGINE: databricks-sql
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5-coder:0.5b}
      EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  # Host-Ollama: run `ollama serve` on the machine, then:
  #   docker compose --profile host-ollama up --build db-agent-host
  db-agent-host:
    build:
      context: ./app
      dockerfile: Dockerfile
    profiles: ["host-ollama"]
    ports:
      - "3001:3001"
    env_file:
      - ./app/.env
    environment:
      PORT: "3001"
      SQL_ENGINE: databricks-sql
      LLM_BASE_URL: http://host.docker.internal:11434/v1
      LLM_API_KEY: ollama
      LLM_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5-coder:0.5b}
      EMBEDDING_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama_data:
