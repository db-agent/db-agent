# Render Blueprint — deploys the DB Agent demo (app/) as a free web service.
# Dashboard: New + → Blueprint → select this repo. Render reads this file.
#
# Free tier notes: the service sleeps after 15 min idle (~30-60s cold start on
# the next request). The bundled SQLite demo DB ships in the repo; memory and
# feedback writes go to ephemeral disk and reset on each deploy — fine for a demo.
#
# The app starts on the bundled SQLite demo database and the OpenAI endpoint (gpt-4o-mini). It holds no API key:
# open the sidebar, LLM settings, and paste one (kept in server memory, applies to everyone using this
# service, gone on restart). The same sidebar has a Databricks connection form to point it at a warehouse.
# For an always-on key, add LLM_API_KEY in the Render dashboard (Environment).
# Nothing here points at any Databricks workspace.
services:
  - type: web
    name: db-agent-demo
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      # node:sqlite needs Node 22.5 or newer.
      - key: NODE_VERSION
        value: "22"
      - key: SQL_ENGINE
        value: sqlite
      - key: LLM_BASE_URL
        value: "https://api.openai.com/v1"
      - key: LLM_MODEL
        value: "gpt-4o-mini"
      # Public single-instance demo: cross-agent memory does nothing useful here
      # and would double LLM calls per question once a real key is added.
      - key: MEMORY_ENABLED
        value: "false"
      - key: DBAGENT_ID
        value: "render-demo"
