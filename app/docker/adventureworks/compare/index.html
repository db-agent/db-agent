<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>db-agent: with and without an ontology</title>
<style>
  :root { --azure:#0078d4; --orange:#d9480f; --bg:#ffffff; --fg:#1b2733; --muted:#5b6b7b; --line:#d9e1e8; --card:#f6f9fc; --code:#eef3f8; --on:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --azure:#4aa3f0; --orange:#ff8a5c; --bg:#0f1720; --fg:#e8eef4; --muted:#9db0c2; --line:#2a3846; --card:#16212c; --code:#1c2935; --on:#0f1720; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  header a { color: var(--azure); text-decoration: none; font-size: 13px; }
  main { padding: 16px 24px 40px; max-width: 1500px; margin: 0 auto; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  input[type=text] { flex: 1 1 420px; padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); }
  select { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); max-width: 360px; }
  button { padding: 10px 16px; font-size: 14px; border: 0; border-radius: 8px; background: var(--azure); color: var(--on); cursor: pointer; font-weight: 600; }
  button.alt { background: transparent; color: var(--azure); border: 1px solid var(--azure); }
  button:disabled { opacity: .5; cursor: default; }
  .tally { display: flex; gap: 16px; margin: 12px 0; }
  .tally div { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--card); }
  .tally b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .cols, .tally { grid-template-columns: 1fr; flex-direction: column; } }
  .col { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card); min-height: 120px; }
  .col.plain { border-top: 4px solid var(--muted); } .col.curated { border-top: 4px solid var(--azure); }
  .col h2 { margin: 0 0 2px; font-size: 15px; } .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--on); }
  .ok { background: var(--azure); } .bad { background: var(--orange); } .neutral { background: var(--muted); }
  pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; font-size: 12.5px; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 6px; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .ref { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .err { color: var(--orange); font-size: 13px; }
  #log { margin-top: 20px; } #log td:first-child { width: 55%; }
</style>
</head>
<body>
<header>
  <h1>Same question, same database, same model: without and with the ontology</h1>
  <a id="linkPlain" target="_blank" rel="noopener">Open the instance without it</a>
  <a id="linkCurated" target="_blank" rel="noopener">Open the instance with it</a>
</header>
<main>
  <form id="f">
    <input type="text" id="q" placeholder="Ask AdventureWorks a question" autocomplete="off">
    <button type="submit" id="go">Ask both</button>
    <select id="sample"><option value="">Pick a prepared question</option></select>
    <button type="button" class="alt" id="all">Run all prepared questions</button>
  </form>
  <div class="tally">
    <div><span class="sub">Without the ontology</span><br><b id="tp">0</b> <span id="tpOf" class="sub"></span><div class="sub" id="ip"></div></div>
    <div><span class="sub">With the ontology</span><br><b id="tc">0</b> <span id="tcOf" class="sub"></span><div class="sub" id="ic"></div></div>
  </div>
  <div class="cols">
    <section class="col plain"><h2>Without the ontology</h2><div class="sub" id="sp">schema only</div><div id="op"></div></section>
    <section class="col curated"><h2>With the ontology</h2><div class="sub" id="sc">schema and the shared knowledge file</div><div id="oc"></div></section>
  </div>
  <div id="refWrap"></div>
  <table id="log" hidden><thead><tr><th>Question</th><th>Without</th><th>With</th></tr></thead><tbody></tbody></table>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let cases = [], score = { plain: [0, 0], curated: [0, 0] }, tokens = { plain: 0, curated: 0 };

function table(cols, rows) {
  if (!rows.length) return '<div class="meta">No rows.</div>';
  return "<table><thead><tr>" + cols.map((c) => `<th>${esc(c)}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map((r) => "<tr>" + r.map((v) => `<td>${esc(v)}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
}
function badge(r) {
  if (r.match === true) return '<span class="badge ok">matches the correct answer</span>';
  if (r.match === false) return `<span class="badge bad">${r.status === "complete" ? "different from the correct answer" : "no answer"}</span>`;
  return r.status === "complete" ? '<span class="badge neutral">answered</span>' : `<span class="badge bad">${esc(r.status)}</span>`;
}
function render(el, r) {
  el.innerHTML = badge(r) + (r.error ? `<div class="err">${esc(r.error)}</div>` : "") +
    (r.sql ? `<pre>${esc(r.sql)}</pre>` : "") + (r.status === "complete" ? table(r.columns, r.rows) : "") +
    `<div class="meta">${r.rowCount} row(s) &middot; ${(r.ms / 1000).toFixed(1)} s &middot; ${r.tokens.toLocaleString()} tokens` +
    `${r.repairs ? ` &middot; ${r.repairs} repair attempt(s)` : ""}${r.llmUsd != null ? ` &middot; LLM est. $${r.llmUsd.toFixed(5)}` : ""}</div>`;
}
function tally(res) {
  for (const side of ["plain", "curated"]) {
    const r = res[side];
    tokens[side] += r.tokens;
    if (res.reference) { score[side][1]++; if (r.match) score[side][0]++; }
  }
  $("tp").textContent = score.plain[0]; $("tpOf").textContent = `of ${score.plain[1]} correct`; $("ip").textContent = `${tokens.plain.toLocaleString()} tokens`;
  $("tc").textContent = score.curated[0]; $("tcOf").textContent = `of ${score.curated[1]} correct`; $("ic").textContent = `${tokens.curated.toLocaleString()} tokens`;
}
async function post(question, caseId) {
  const res = await fetch("/api/compare", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ question, caseId }) });
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || "request failed");
  return body;
}
function show(res, addToLog) {
  render($("op"), res.plain); render($("oc"), res.curated);
  $("refWrap").innerHTML = res.reference ? `<div class="ref"><b>Correct SQL</b> (${esc(res.difficulty)})<pre>${esc(res.reference.sql)}</pre>${table(res.reference.columns, res.reference.rows)}</div>` : "";
  tally(res);
  if (addToLog) {
    $("log").hidden = false;
    const tr = document.createElement("tr");
    const cell = (r) => (r.match === true ? "correct" : r.match === false ? "wrong" : r.status);
    tr.innerHTML = `<td>${esc(res.question)}</td><td>${cell(res.plain)}</td><td>${cell(res.curated)}</td>`;
    $("log").tBodies[0].appendChild(tr);
  }
}
function busy(on) { for (const id of ["go", "all"]) $(id).disabled = on; }
async function ask(question, caseId, addToLog = false) {
  $("op").innerHTML = $("oc").innerHTML = '<div class="meta">Asking the model...</div>';
  try { show(await post(question, caseId), addToLog); }
  catch (exc) { $("op").innerHTML = $("oc").innerHTML = `<div class="err">${esc(exc.message)}</div>`; }
}
$("f").addEventListener("submit", async (e) => { e.preventDefault(); const q = $("q").value.trim(); if (!q) return; busy(true); await ask(q, null, true); busy(false); });
$("sample").addEventListener("change", () => { const i = $("sample").value; if (i !== "") $("q").value = cases[Number(i)].question; });
$("all").addEventListener("click", async () => {
  busy(true); score = { plain: [0, 0], curated: [0, 0] }; tokens = { plain: 0, curated: 0 }; $("log").tBodies[0].innerHTML = "";
  for (const c of cases) { $("q").value = c.question; await ask(c.question, c.id, true); }
  busy(false);
});
fetch("/api/cases").then((r) => r.json()).then((list) => {
  cases = list;
  // /?q=question asks straight away (handy for a bookmark or a screenshot).
  const preset = new URLSearchParams(location.search).get("q");
  if (preset) { $("q").value = preset; $("f").requestSubmit(); }
  for (const c of list) { const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.difficulty}: ${c.question}`; $("sample").appendChild(o); }
});
fetch("/api/info").then((r) => r.json()).then((i) => {
  const d = (x) => (x.error ? x.error : `${x.model}. ${x.notes} notes, ${x.definitions} definitions, ${x.rules} rules, ${x.examples} examples`);
  $("sp").textContent = d(i.plain); $("sc").textContent = d(i.curated);
  $("linkPlain").href = `${location.protocol}//${location.hostname}:${i.plain.port}`;
  $("linkCurated").href = `${location.protocol}//${location.hostname}:${i.curated.port}`;
});
</script>
</body>
</html>
