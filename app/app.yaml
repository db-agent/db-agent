# Databricks Apps manifest — deploys the Node.js prototype as its own app,
# separate from the root Streamlit app (db-agent).
#
# Deploy from this directory:
#   databricks apps create db-agent-node --description "Node.js/React prototype of DB Agent"
#   databricks apps deploy db-agent-node --source-code-path .
#
# Databricks runs `npm install`, then `npm run build` (builds web/dist via
# the "build" script in package.json), then this command — no manual build
# step needed before deploying.
#
# Docs: https://docs.databricks.com/dev-tools/databricks-apps/index.html

command: ["npm", "run", "start"]

resources:
  - name: llm-api-key
    secret:
      scope: db-agent
      key: ai-gateway-token
      permission: READ
  - name: embedding-api-key
    secret:
      scope: db-agent
      key: embedding-token
      permission: READ
  - name: lakebase-db-url
    secret:
      scope: db-agent
      key: lakebase-db-url
      permission: READ

env:
  # Databricks AI Gateway (Mosaic AI Model Serving) — OpenAI-compatible
  # endpoint. LLM_BASE_URL excludes the trailing /chat/completions since
  # the OpenAI SDK (used in server.js) appends that itself.
  - name: "LLM_BASE_URL"
    value: "https://dbc-d2076193-9bc7.cloud.databricks.com/ai-gateway/mlflow/v1"
  - name: "LLM_MODEL"
    value: "system.ai.meta-llama-3-1-8b-instruct"
  - name: "LLM_API_KEY"
    valueFrom: "llm-api-key"
  - name: "EMBEDDING_MODEL"
    value: "system.ai.qwen3-embedding-0-6b"
  # Chat and embeddings are two separate AI Gateway routes with two
  # separate tokens — confirmed via curl that LLM_API_KEY does not work
  # against /embeddings and vice versa. EMBEDDING_API_KEY falls back to
  # LLM_API_KEY in server.js if unset, but wiring it explicitly here is
  # what actually fixes cross-route 401s that surfaced as opaque
  # "Connection error." (see describeError() in logger.js).
  - name: "EMBEDDING_API_KEY"
    valueFrom: "embedding-api-key"
  # SQL_ENGINE=postgres queries Databricks Lakebase directly (see
  # sqlEngines/postgres.js) instead of the bundled SQLite demo DB.
  # DB_URL points at a role scoped to SELECT-only — see app/README.md's
  # "pgvector" section for why the read role and the memory-write role
  # (used separately by MEMORY_BACKEND=pgvector) must not be the same one.
  - name: "SQL_ENGINE"
    value: "postgres"
  - name: "DB_URL"
    valueFrom: "lakebase-db-url"
